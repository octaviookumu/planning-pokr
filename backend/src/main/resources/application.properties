spring.application.name=planning-poker-backend
server.port=8080

# Rooms live entirely in memory - no database. Restarting the server clears all rooms.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Comma-separated list of origins allowed to call the API / open WebSocket
# connections. Defaults to the local Angular dev server. In production
# (Render), set CORS_ALLOWED_ORIGINS to your deployed frontend URL(s),
# e.g. https://your-app.vercel.app - include multiple by separating with
# commas, no spaces: https://your-app.vercel.app,http://localhost:4200
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
